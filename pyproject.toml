[project]
name = "skill-manager"
version = "0.1.0"
description = "Declarative source, profile, and provisioning manager for AI agent skills"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "kwkeefer", email = "kwkeefer@gmail.com" }
]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.12,<3",
    "pyyaml>=6.0,<7",
    "rich==15.0.0",
]

[project.scripts]
skm = "skill_manager:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9,<10",
]
